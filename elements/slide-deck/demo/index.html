<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">
    <title>SlideDeck: slide-deck Demo</title>
    <script src="../../../node_modules/@haxtheweb/deduping-fix/deduping-fix.js"></script>
    <script type="module">
      import '../slide-deck.js';
    </script>
    <style>
      /* the page draws its own background in both schemes, as every HAX
         theme does, so light-dark() text is checked against what it really
         sits on (an unset canvas reads as white to axe in dark mode) */
      html {
        color-scheme: light dark;
      }
      body {
        color: light-dark(
          var(--ddd-theme-default-coalyGray, #262626),
          var(--ddd-theme-default-white, #ffffff)
        );
        background-color: light-dark(
          var(--ddd-theme-default-white, #ffffff),
          var(--ddd-theme-default-coalyGray, #262626)
        );
      }
    </style>
  </head>
  <body>
    <div class="vertical-section-container centered">
      <h3>Basic slide-deck demo</h3>
      <p>
        This manifest names a <code>pptx</code>, so the original slides are
        painted over the text layer once the deck scrolls into view. The text
        and speaker notes always render underneath, so the deck stays readable,
        searchable and navigable even if the renderer cannot run.
      </p>
      <slide-deck source="./deck.json" deck-id="demo"></slide-deck>
    </div>
  </body>
</html>
