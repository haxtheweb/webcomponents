<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">
    <title>MeritBadge: merit-badge Demo</title>
    <script src="../../../node_modules/@haxtheweb/deduping-fix/deduping-fix.js"></script>

    <script type="module">
      
      import "@haxtheweb/demo-snippet/demo-snippet.js";
      import '../merit-badge.js';
    </script>
    
  </head>
  <body>
    <div class="vertical-section-container centered">
      <h3>Basic merit-badge demo</h3>
      <demo-snippet>
        <template>
          <merit-badge
            badge-image="https://www.iconpacks.net/icons/2/free-click-icon-2384-thumb.png"
            badge-title="The Internet Badge"
            badge-details="You have demonstrated skill in using the internet!"
            hyper-link="https://www.google.com/"
            badge-skills="Common, Boring, Clicking, Finger Strength"
            badge-color="green"
            badge-unlocked
          ></merit-badge>
          <merit-badge
            badge-image="https://cdn-icons-png.flaticon.com/512/66/66326.png"
            badge-title="Midevil Age Art"
            badge-details="Knowledgable in Midevil Arts & Cultures"
            hyper-link="https://www.youtube.com/"
            badge-skills="Smart, Midevil, Outdated, Cultured"
            badge-color="red"
          ></merit-badge>
        </template>
      </demo-snippet>
    </div>
  </body>
</html>
