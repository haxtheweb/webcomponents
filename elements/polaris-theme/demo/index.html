<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">
    <title>PolarisTheme: polaris-theme Demo</title>
    <script src="../../../node_modules/@haxtheweb/deduping-fix/deduping-fix.js"></script>
    <script type="module">
      
      import "@haxtheweb/demo-snippet/demo-snippet.js";
      import '../lib/polaris-story-card.js';
      import '../lib/polaris-mark.js';
    </script>
    <style>
      .container {
        margin: 64px;
      }
      h3 {
        font-family: "Roboto", Arial, Helvetica, sans-serif;
      }
      /* Put cards in a flex row so they auto-size 3-4 across. */
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
      }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Slab:wght@400;500&family=Roboto:wght@400;500;700;900&display=swap" />
  </head>
  <body>
    <div class="vertical-section-container centered">
      <h3>Basic polaris-mark</h3>
      <demo-snippet>
        <template>
          <div class="container">
            <polaris-mark></polaris-mark>
            <polaris-mark></polaris-mark>
          </div>
        </template>
      </demo-snippet>
      <h3>Linked story cards — 3 across (auto-sized)</h3>
      <demo-snippet>
        <template>
          <div class="container">
            <div class="row">
              <polaris-story-card
                link="https://hax.psu.edu/"
                image="https://placehold.co/600x400/001e44/EEE"
                pillar="Education"
                label="From the Waiting Room to the Living Room"
              ></polaris-story-card>
              <polaris-story-card
                link="https://hax.psu.edu/"
                image="https://placehold.co/500x200/1e407c/EEE"
                pillar="Education"
                label="Beyond Limitations"
              ></polaris-story-card>
              <polaris-story-card
                link="https://hax.psu.edu/"
                image="https://placehold.co/300x400/96bee6/001e44"
                pillar="Community"
                label="Building Community Through Compassion"
              ></polaris-story-card>
            </div>
          </div>
        </template>
      </demo-snippet>
      <h3>Story cards — 4 across (background sizing, empty pillar)</h3>
      <demo-snippet>
        <template>
          <div class="container">
            <div class="row">
              <polaris-story-card
                link="https://hax.psu.edu/"
                image="https://placehold.co/480/640/001e44/EEE?text=cover"
                pillar="Research"
                label="Discovery in action"
              ></polaris-story-card>
              <polaris-story-card
                link="https://hax.psu.edu/"
                image="https://placehold.co/480/640/1e407c/EEE?text=cover"
                pillar="Service"
                label="Leading with care"
              ></polaris-story-card>
              <polaris-story-card
                link="https://hax.psu.edu/"
                image="https://placehold.co/480/640/96bee6/001e44?text=no-pillar"
                label="No pillar label rendered here"
              ></polaris-story-card>
              <polaris-story-card
                link="https://hax.psu.edu/"
                image="https://placehold.co/480/640/4f627c/EEE?text=contain+fixed"
                pillar="Global"
                background-size="contain"
                background-attachment="fixed"
                label="Contain + fixed attachment"
              ></polaris-story-card>
            </div>
          </div>
        </template>
      </demo-snippet>
    </div>
  </body>
</html>
