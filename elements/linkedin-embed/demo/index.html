<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">
    <title>LinkedIn embed demo</title>
    <script src="../../../node_modules/@haxtheweb/deduping-fix/deduping-fix.js"></script>
    <script type="module">
      import "@haxtheweb/demo-snippet/demo-snippet.js";
      import "@haxtheweb/grid-plate/grid-plate.js";
      import "../linkedin-embed.js";
    </script>
    <style>
      /* DDD tokens with light-dark() so the demo reads in both color schemes */
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: var(--ddd-font-primary, sans-serif);
        color: light-dark(
          var(--ddd-theme-default-coalyGray, #262626),
          var(--ddd-theme-default-white, #fff)
        );
        background-color: light-dark(
          var(--ddd-theme-default-limestoneMaxLight, #f5f5f5),
          var(--ddd-theme-default-potentialMidnight, #000321)
        );
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: var(--ddd-spacing-4, 16px);
        display: grid;
        /* minmax(0, 1fr) so a long code line scrolls inside its snippet
           instead of widening the page */
        grid-template-columns: minmax(0, 1fr);
        gap: var(--ddd-spacing-4, 16px);
      }
      .intro,
      .demo-card {
        border: var(--ddd-border-xs, 1px solid);
        border-color: light-dark(
          var(--ddd-theme-default-limestoneLight, #e4e5e7),
          var(--ddd-theme-default-slateGray, #314d64)
        );
        border-radius: var(--ddd-radius-md, 8px);
        background-color: light-dark(
          var(--ddd-theme-default-white, #fff),
          var(--ddd-theme-default-coalyGray, #262626)
        );
        padding: var(--ddd-spacing-4, 16px);
      }
      .intro {
        display: grid;
        gap: var(--ddd-spacing-2, 8px);
      }
      .intro h1 {
        margin: 0;
        font-size: var(--ddd-font-size-l, 24px);
      }
      .intro p {
        margin: 0;
      }
      .demo-card h2 {
        margin: 0 0 var(--ddd-spacing-4, 16px);
        font-size: var(--ddd-font-size-m, 20px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <section class="intro">
        <h1>LinkedIn embed</h1>
        <p>
          <code>linkedin-embed</code> renders the LinkedIn profile badge in a single element and can
          be placed in <code>grid-plate</code> layouts.
        </p>
      </section>
      <section class="demo-card">
        <h2>Three-column grid-plate example</h2>
        <p>Columns stack on narrow screens; each badge follows the page&#39;s light or dark mode.</p>
        <grid-plate layout="1-1-1">
          <linkedin-embed slot="col-1" vanityname="btopro"></linkedin-embed>
          <linkedin-embed slot="col-2" vanityname="nisha-neupane-6b7219277"></linkedin-embed>
          <linkedin-embed slot="col-3" vanityname="drdavefusco"></linkedin-embed>
        </grid-plate>
      </section>
      <section class="demo-card">
        <h2>Code sample</h2>
        <demo-snippet>
          <template>
            <grid-plate layout="1-1-1">
              <linkedin-embed slot="col-1" vanityname="btopro"></linkedin-embed>
              <linkedin-embed slot="col-2" vanityname="nisha-neupane-6b7219277"></linkedin-embed>
              <linkedin-embed slot="col-3" vanityname="drdavefusco"></linkedin-embed>
            </grid-plate>
          </template>
        </demo-snippet>
      </section>
    </div>
  </body>
</html>
