<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">
    <title>CitationElement: citation-element Demo</title>
    
    <script src="../../../node_modules/@haxtheweb/deduping-fix/deduping-fix.js"></script>
    <script type="module">
      import "@haxtheweb/demo-snippet/demo-snippet.js";
      import '../citation-element.js';
    </script>
    
    <style>
      /* same switch HAXcms themes use (body.dark-mode) to force dark */
      .dark-mode {
        color-scheme: only dark;
        background-color: var(--ddd-theme-default-potentialMidnight);
        color: var(--ddd-theme-default-white);
        padding: var(--ddd-spacing-4);
      }
    </style>
  </head>
  <body>
    <div class="dark-mode">
      <h3>Dark mode</h3>
      <citation-element creator="Bryan Ollendyke" license="by-sa" title="The btopro blog" source="https://btopro.com/" date="02/01/2018"></citation-element>
    </div>
    <div class="vertical-section-container centered">
      <h3>Basic citation-element demo</h3>
      <demo-snippet>
        <template>
          <p>This is some text</p>
          <citation-element creator="Bryan Ollendyke" scope="sibling" license="by" title="The btopro blog" source="https://btopro.com/" date="02/01/2018"></citation-element>
        </template>
      </demo-snippet>
    </div><div class="vertical-section-container centered">
      <h3>Basic citation-element demo</h3>
      <demo-snippet>
        <template>
          <p>This is some text</p>
          <citation-element creator="Bryan Ollendyke" scope="sibling" license="by" title="The btopro blog" source="https://btopro.com/" date="02/01/2018"></citation-element>
        </template>
      </demo-snippet>
    </div><div class="vertical-section-container centered">
      <h3>Basic citation-element demo</h3>
      <demo-snippet>
        <template>
          <div id="thing" resource="stuff">
            <p>This is some text</p>
            <citation-element creator="Bryan Ollendyke" scope="parent" license="by" title="The btopro blog" source="https://btopro.com/" date="02/01/2018"></citation-element>
          </div>
        </template>
      </demo-snippet>
    </div>
  </body>
</html>
