<h2>Concept runner</h2>
<concept-runner-game id="lab-game-runner" items="[{&quot;label&quot;:&quot;Custom Elements&quot;,&quot;kind&quot;:&quot;good&quot;,&quot;text&quot;:&quot;Define your own HTML tag with customElements.define. Browsers run this natively, so no library is needed.&quot;},{&quot;label&quot;:&quot;React&quot;,&quot;kind&quot;:&quot;bad&quot;,&quot;text&quot;:&quot;A framework with its own runtime and build step. Its components are not browser features, so they need React everywhere they run.&quot;},{&quot;label&quot;:&quot;Shadow DOM&quot;,&quot;kind&quot;:&quot;good&quot;,&quot;text&quot;:&quot;Gives an element private markup and styles that the rest of the page cannot accidentally break.&quot;},{&quot;label&quot;:&quot;TypeScript&quot;,&quot;kind&quot;:&quot;bad&quot;,&quot;text&quot;:&quot;Adds types, but browsers cannot run it. It has to be compiled to JavaScript before it ships.&quot;},{&quot;label&quot;:&quot;HTML Templates&quot;,&quot;kind&quot;:&quot;good&quot;,&quot;text&quot;:&quot;The template element holds markup that stays inert until you clone it, so it is cheap to define and reuse.&quot;},{&quot;label&quot;:&quot;Angular&quot;,&quot;kind&quot;:&quot;bad&quot;,&quot;text&quot;:&quot;A full framework with its own compiler and template language. Its components need that toolchain and runtime to work.&quot;},{&quot;label&quot;:&quot;Slots&quot;,&quot;kind&quot;:&quot;good&quot;,&quot;text&quot;:&quot;Slots let authors drop their own content into an element, which is how one element can wrap anything.&quot;},{&quot;label&quot;:&quot;JSX&quot;,&quot;kind&quot;:&quot;bad&quot;,&quot;text&quot;:&quot;Markup written inside JavaScript that browsers do not understand. It has to be compiled away first.&quot;},{&quot;label&quot;:&quot;ES Modules&quot;,&quot;kind&quot;:&quot;good&quot;,&quot;text&quot;:&quot;Native import and export load an element's code with no bundler in between.&quot;},{&quot;label&quot;:&quot;jQuery&quot;,&quot;kind&quot;:&quot;bad&quot;,&quot;text&quot;:&quot;A library that smoothed over old browser differences. Most of what it did is now native, like querySelector and fetch.&quot;},{&quot;label&quot;:&quot;ElementInternals&quot;,&quot;kind&quot;:&quot;good&quot;,&quot;text&quot;:&quot;Lets a custom element join forms and expose accessibility roles and states through the browser itself.&quot;},{&quot;label&quot;:&quot;Vue&quot;,&quot;kind&quot;:&quot;bad&quot;,&quot;text&quot;:&quot;Single file components need a compiler and the Vue runtime, so they are not plain browser code.&quot;}]" prompt="Quiz me on the web component standards so I remember what I just played. Use custom elements, shadow DOM, HTML templates, slots, ES modules and ElementInternals.

<h2>Concept quest</h2>
<concept-quest-game id="lab-game-quest" nodes="[{&quot;label&quot;:&quot;Accessible&quot;,&quot;link&quot;:&quot;for everyone&quot;,&quot;text&quot;:&quot;HAX will always strive to maximize accessibility. The best time to make content accessible is the moment it is created, so HAX builds that into authoring instead of leaving it for later.&quot;,&quot;question&quot;:&quot;When is the best time to make content accessible?&quot;,&quot;choices&quot;:&quot;The moment it is created\nRight before it is published\nAfter someone complains\nOnly for public sites&quot;,&quot;hint&quot;:&quot;Think about when authoring happens.&quot;},{&quot;label&quot;:&quot;Extensible&quot;,&quot;link&quot;:&quot;anyone can add&quot;,&quot;text&quot;:&quot;Nothing in HAX is monolithic. The ecosystem keeps growing and contributions are welcome, so the system can be extended sustainably.&quot;,&quot;question&quot;:&quot;What does it mean that HAX is non-monolithic?&quot;,&quot;choices&quot;:&quot;It keeps growing as people add to it\nIt ships as one big package\nOnly the core team can change it\nIt cannot be extended&quot;,&quot;hint&quot;:&quot;Contributions are welcome.&quot;},{&quot;label&quot;:&quot;Free and Open&quot;,&quot;link&quot;:&quot;no cost, no lock-in&quot;,&quot;text&quot;:&quot;Open documentation, open APIs and an open community. Content moves freely into and out of HAX, everything generates static files, and it costs nothing to use.&quot;,&quot;question&quot;:&quot;What happens to your content if you leave HAX?&quot;,&quot;choices&quot;:&quot;It moves out freely as static files\nIt stays locked inside HAX\nIt is deleted\nYou pay to export it&quot;,&quot;hint&quot;:&quot;Everything generates static files.&quot;},{&quot;label&quot;:&quot;Efficient&quot;,&quot;link&quot;:&quot;fast and light&quot;,&quot;text&quot;:&quot;Built to perform well through good methodology, low-level browser APIs, micro-services and lazy loading.&quot;,&quot;question&quot;:&quot;Which of these helps HAX stay efficient?&quot;,&quot;choices&quot;:&quot;Lazy loading elements only when they are needed\nLoading every element on every page\nShipping a heavy framework\nRebuilding the page on every click&quot;,&quot;hint&quot;:&quot;Load only what the page uses.&quot;},{&quot;label&quot;:&quot;Platform Agnostic&quot;,&quot;link&quot;:&quot;runs anywhere&quot;,&quot;text&quot;:&quot;HAX output works on its own, inside HAXcms or HAXiam, or on plain static pages, with no hosting-specific backend to depend on.&quot;,&quot;question&quot;:&quot;Where can HAX content run?&quot;,&quot;choices&quot;:&quot;Standalone, in HAXcms or HAXiam, or on plain static pages\nOnly inside one vendor's hosting\nOnly with one specific database\nOnly on a single campus network&quot;,&quot;hint&quot;:&quot;No hosting-specific backend.&quot;},{&quot;label&quot;:&quot;Remixable&quot;,&quot;link&quot;:&quot;make it yours&quot;,&quot;text&quot;:&quot;Duplicate a site, switch themes on the fly and reshape the structure of a whole site or a single page. The platform and what it produces are meant to be remixed.&quot;,&quot;question&quot;:&quot;Which of these can you do to remix a HAX site?&quot;,&quot;choices&quot;:&quot;Duplicate it and switch themes on the fly\nNothing, sites are fixed once made\nEdit it only through a vendor\nChange the theme only by rewriting every page&quot;,&quot;hint&quot;:&quot;Themes can change on the fly.&quot;},{&quot;label&quot;:&quot;Sustainable&quot;,&quot;link&quot;:&quot;built to last&quot;,&quot;text&quot;:&quot;Sustainable for the planet, with less data and battery use, and for the long run, because an open source community can outlive any single vendor.&quot;,&quot;question&quot;:&quot;Why is HAX sustainable beyond using less energy?&quot;,&quot;choices&quot;:&quot;An open source community can outlive any single vendor\nIt needs a yearly subscription\nIt depends on one company\nIt is rebuilt from scratch every year&quot;,&quot;hint&quot;:&quot;Vendors vanish, communities can last.&quot;}]" hub-label="The Ubiquitous Web" seed="quest" finish-title="Every house unlocked" finish-text="Every concept has been defeated and every house is open." quest-title="Your quest" quest="Wander the overworld. When a concept finds you, answer its question to defeat it and unlock its house." finish-lead="Paste this into Claude to keep practicing."></concept-quest-game>
