  <style>
    body {
        color-scheme: light;
        margin: 0;
        padding: 0;
        font-family: var(--ddd-font-primary, sans-serif);
        overflow-x: hidden;
        --app-hax-accent-color: black;
        --app-hax-background-color: white;
        --simple-tooltip-background: #000000;
        --simple-tooltip-opacity: 1;
        --simple-tooltip-text-color: #ffffff;
        --simple-tooltip-delay-in: 0;
        --simple-tooltip-duration-in: 200ms;
        --simple-tooltip-duration-out: 0;
        --simple-tooltip-border-radius: 0;
        --simple-tooltip-font-size: 14px;
      }
      body.dark-mode {
        color-scheme: dark;
        background-color: black;
        --app-hax-accent-color: white;
        --app-hax-background-color: black;
        --simple-tooltip-background: #ffffff;
        --simple-tooltip-text-color: #000000;
      }
      div[slot="externalproviders"] {
        display: none;
      }
      body.app-loaded div[slot="externalproviders"] {
        display: unset;
      }
      app-hax {
        display: block;
        min-height: 100vh;
      }

      #loading {
        color-scheme: light dark;
        background-color: light-dark(#dadada, #15202b);
        color: light-dark(#15202b, #dadada);
        inset: 0;
        opacity: 1;
        position: fixed;
        z-index: 99999999;
      }
      #loading .loading-circle {
        width: 20vw;
        height: 20vw;
        background-color: #06b9a5;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 24px auto;
      }
      #loading.loaded {
        animation: fade-out .1s ease-in-out;
        animation-fill-mode: forwards;
      }
      #loading div.messaging {
        left: 0px;
        position: absolute;
        right: 0px;
        text-align: center;
        top: 10vh;
      }
      #loading div.messaging h1 {
        font-family: Helvetica, Verdana, sans-serif !important;
        font-size: 4vw !important;
        margin: 24px auto 0;
        padding: 0;
      }

      .progress-line,
      .progress-line:before {
        border-radius: 8px;
        height: 20px;
        width: 100%;
        margin: auto;
      }
      .progress-line {
        background-color: #ab2101;
        border-radius: 8px;
        display: -webkit-flex;
        display: flex;
        width: 40vw;
        margin: 0 auto;
      }
      .progress-line:before {
        border-radius: 8px;
        background-color: #930d0d;
        content: '';
        animation: running-progress 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes running-progress {
        0% {
          margin-left: 0px;
          margin-right: 100%;
        }
        50% {
          margin-left: 25%;
          margin-right: 0%;
        }
        100% {
          margin-left: 100%;
          margin-right: 0;
        }
      }
      @keyframes fade-out {
        0% {
          opacity: 1;
        }
        99% {
          opacity: 0;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @media (min-width: 721px) {
        :root {
          background-size: auto, 23% auto, 23% auto;
        }
      }

      @media (min-width: 601px) and (max-width: 720px) {
        :root {
          background-size: auto, 26% auto, 26% auto;
        }
      }

      @media (min-width: 481px) and (max-width: 600px) {
        :root {
          background-size: auto, 30% auto, 30% auto;
        }
      }

      @media (min-width: 371px) and (max-width: 480px) {
        :root {
          background-size: auto, 35% auto, 35% auto;
        }
      }

      @media (max-width: 370px) {
        :root {
          background-size: auto, 37% auto, 37% auto;
        }
      }
  </style>
  <script id="loadingscript">
    globalThis.dataLayer = globalThis.dataLayer || [];

      function hideLoading() {
        if (loadingDismissed) {
          return;
        }
        loadingDismissed = true;
        var loadingEl = document.querySelector('#loading');
        if (!loadingEl) {
          return;
        }
        globalThis.requestAnimationFrame(function () {
          globalThis.requestAnimationFrame(function () {
            loadingEl.classList.add('loaded');
            loadingEl.setAttribute('aria-busy', 'false');
            setTimeout(function () {
              loadingEl.setAttribute('hidden', 'hidden');
            }, 120);
          });
        });
      }
      globalThis.addEventListener(
        'json-outline-schema-active-body-changed',
        function () {
          hideLoading();
        },
        { once: true }
      );
      globalThis.addEventListener(
        'haxcms-ready',
        function () {
          setTimeout(function () {
            loadAnalyticsFromManifest();
          }, 150);
          setTimeout(function () {
            hideLoading();
          }, 2500);
        },
        { once: true }
      );
    })();

      // reduce FOUC for dark mode so it starts in dark rapidly if selected
    (function () {
      try {
        var ls = globalThis.localStorage;
        var stored = ls ? ls.getItem('app-hax-darkMode') : null;
        var dark = stored !== null
          ? stored === 'true'
          : !!(globalThis.matchMedia && globalThis.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.body.classList.add('dark-mode');
        } else {
          document.body.classList.remove('dark-mode');
        }
      } catch (e) {}
    })();
