<p>Percent composition tells you the mass share of each element in a compound.</p>
<p>Divide the element mass by the molar mass.</p>
<p>Multiply by one hundred.</p>
<p>The parts add to one hundred percent.</p>
<p>Use it to find empirical formulas.</p>
<p>Practice with water and glucose.</p>
