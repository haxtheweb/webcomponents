<h2>Writing callouts</h2>
<a11y-collapse-group>
<a11y-collapse heading="Lead with the point"><p slot="content">Put what the reader must know in the title; use the message for detail.</p></a11y-collapse>
<a11y-collapse heading="Don't stack them"><p slot="content">Two callouts in a row read as noise. Merge them or move one into the text.</p></a11y-collapse>
