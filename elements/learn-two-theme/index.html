<!doctype html>
<html lang="en">

<head>
  <script>
    // anchor the HAXcms router + relative paths to this element's folder so
    // the preview works from the monorepo root (dev server, Vercel) and when
    // the element folder itself is the web root
    (() => {
      const loc = globalThis.location;
      if (loc.pathname.endsWith("/index.html")) {
        globalThis.history.replaceState(null, "", loc.pathname.replace(/index\.html$/, "") + loc.search + loc.hash);
      }
      const m = loc.pathname.match(/^(.*\/elements\/[^/]+\/)/);
      const base = globalThis.document.createElement("base");
      base.href = m ? m[1] : "/";
      globalThis.document.head.appendChild(base);
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="Description" content="Demonstration for learn-two-theme">
  <title>learn-two-theme</title>
</head>

<body>
  <haxcms-site-builder id="site" outline-location="demo/" file="site.json"></haxcms-site-builder>
  <script>
    globalThis.process = globalThis.process || {
      env: {
        NODE_ENV: 'production'
      }
    }
  </script>
  <script type="module">
    import '@haxtheweb/haxcms-elements/lib/core/haxcms-site-builder.js'
    import './learn-two-theme.js'
  </script>
</body>
</html>
