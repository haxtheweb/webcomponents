<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">
    <title>element-doc-player demo</title>
    <script src="../../../node_modules/@haxtheweb/deduping-fix/deduping-fix.js"></script>
    <script type="module">
      import '../element-doc-player.js';
    </script>
  </head>
  <body>
    <div class="vertical-section-container centered">
      <h3>With an animated walkthrough</h3>
      <p>Docs data and a storyboard, both loaded from JSON files.</p>
      <element-doc-player
        docs-src="./meme-maker.docs.json"
        motion-src="../../meme-maker/lib/meme-maker.motion.json"
      ></element-doc-player>

      <h3>Documentation only</h3>
      <p>Elements without a storyboard still get demo, documentation and schema. The Walkthrough tab is left out.</p>
      <element-doc-player
        docs-src="./meme-maker.docs.json"
      ></element-doc-player>
    </div>
  </body>
</html>
