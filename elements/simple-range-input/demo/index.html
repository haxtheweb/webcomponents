<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">
    <title>SimpleRangeInput: simple-range-input Demo</title>
    <script src="../../../node_modules/@haxtheweb/deduping-fix/deduping-fix.js"></script>

    <script type="module">
      
      import "@haxtheweb/demo-snippet/demo-snippet.js";
      import '../simple-range-input.js';
    </script>
    
  </head>
  <body>
    <div class="vertical-section-container centered">
      <h3>Basic simple-range-input demo</h3>
      <demo-snippet>
        <template>
          <!-- #3107: the bare default now resolves the DDD token fallbacks
             (the DDD base class registers the design system) -->
          <simple-range-input id="test"></simple-range-input>
          <simple-range-input accent-color="blue"style="--simple-range-input-track-height:15px"></simple-range-input>
          <simple-range-input accent-color="orange" dark style="--simple-range-input-pin-height:10px;--simple-range-input-track-height:2px"></simple-range-input>
          <simple-range-input disabled style="--simple-range-input-pin-height:30px;--simple-range-input-track-height:50px"></simple-range-input>
        </template>
      </demo-snippet>
      <h3>Pin lift for seek bars</h3>
      <p>Grab the pin (or tab to it) and the track bends up under it. Use it on long scrubbers such as media seek bars, not on short sliders or settings.</p>
      <demo-snippet>
        <template>
          <simple-range-input lift label="Seek" min="0" max="180" value="59" style="--simple-range-input-track-height:var(--ddd-spacing-1);--simple-range-input-pin-height:var(--ddd-spacing-4);--simple-range-input-track-border-radius:var(--ddd-radius-rounded);--simple-range-input-fill-color:var(--ddd-theme-default-link)"></simple-range-input>
          <simple-range-input lift dark label="Seek" min="0" max="180" value="120" style="--simple-range-input-track-height:var(--ddd-spacing-1);--simple-range-input-pin-height:var(--ddd-spacing-4);--simple-range-input-track-border-radius:var(--ddd-radius-rounded);--simple-range-input-fill-color:var(--ddd-theme-default-linkLight)"></simple-range-input>
        </template>
      </demo-snippet>
    </div>
  </body>
</html>
