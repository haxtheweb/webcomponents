<!doctype html>
<html lang="en">

<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="Description" content="Demonstration for bibliography-builder">

  <style>
    :root, html, body {
      margin: var(--ddd-spacing-0);
      padding: var(--ddd-spacing-0);
    }
    #demo {
      margin: var(--ddd-spacing-2);
    }
  </style>
  <title>bibliography-builder</title>
</head>

<body>
  <div id="demo">
    <h1>bibliography-builder</h1>
    <demo-snippet>
      <template>
        <bibliography-builder title="Week 4 readings">
          <bibliography-item publication-date="2025-03-05" url="https://hax.psu.edu/"></bibliography-item>
          <bibliography-item citation-type="journal" title="Make your own citation" publisher="[Journal name]" publication-date="2024-06-01" volume="12" issue="3" start-page="45" end-page="60"></bibliography-item>
        </bibliography-builder>
      </template>
    </demo-snippet>
    <demo-snippet>
      <template>
        <bibliography-builder title="References">
          <bibliography-item citation-type="book" title="A book with no edition or pages"></bibliography-item>
        </bibliography-builder>
      </template>
    </demo-snippet>
  </div>
  <script type="module" src="../bibliography-builder.js"></script>
  <script type="module">
    import "@haxtheweb/demo-snippet/demo-snippet.js";
  </script>
</body>
</html>
