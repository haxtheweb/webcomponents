<p>A note sets a short message apart from the running text.</p>
<stop-note status="info" title="Note"><span slot="message">Useful to know, and safe to skip.</span></stop-note>
<stop-note status="warning" title="Warning"><span slot="message">Read this before you carry on.</span></stop-note>
<stop-note status="stop" title="Stop"><span slot="message">Do not continue until this is done.</span></stop-note>
<stop-note status="success" title="Done"><span slot="message">This step is complete.</span></stop-note>
