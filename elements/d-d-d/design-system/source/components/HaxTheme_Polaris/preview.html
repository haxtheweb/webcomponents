<!-- @dsCard group="Themes" height=640 subtitle="HAX theme - polaris-theme" -->
<script>
  // HAXcms takes its base path from the document's base element: point it at this
  // theme's demo site (shipped under runtime/sites/) and open the first page.
  (function () {
    var b = document.createElement("base");
    b.href = new URL("../../runtime/sites/polaris-theme/", location.href).href;
    document.head.prepend(b);
    history.replaceState(null, "", new URL("welcome", b.href).pathname);
  })();
</script>
<haxcms-site-builder file="site.json"></haxcms-site-builder>
