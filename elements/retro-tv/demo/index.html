<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">
    <title>retro-tv demo</title>
    <script src="../../../node_modules/@haxtheweb/deduping-fix/deduping-fix.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Russo+One&family=Press+Start+2P&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <script type="module">
      import "../retro-tv.js";
      import "../lib/programs/retro-tv-title-sequence.js";
      import "../lib/programs/retro-tv-hax-tv.js";
      import "../lib/programs/retro-tv-credits.js";
      import "../lib/programs/retro-tv-home-computer.js";
      import "../lib/programs/retro-tv-handheld.js";
      import "../lib/programs/retro-tv-pc.js";
      import "../lib/programs/retro-tv-disc.js";
      const tv = document.querySelector("#tv");
      const now = document.querySelector("#now");
      const show = () => {
        const p = tv.program;
        now.textContent = tv.power ? (p ? p.programName : "No signal") : "Off";
      };
      tv.addEventListener("retro-tv-channel-changed", show);
      tv.addEventListener("retro-tv-power-changed", show);
      document.querySelector("#prev").addEventListener("click", () => tv.previous());
      document.querySelector("#next").addEventListener("click", () => tv.next());
      document.querySelector("#power").addEventListener("click", () => tv.togglePower());
      document.querySelector("#load").addEventListener("click", () => {
        const p = tv.program;
        if (p) {
          p.loading = !p.loading;
        }
      });
      customElements.whenDefined("retro-tv-hax-tv").then(() => setTimeout(show, 50));
    </script>
    <style>
      body { margin: 0; padding: 24px; background: #262626; color: #fff; font-family: "Roboto Condensed", sans-serif; }
      .wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 16px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      button { font: inherit; padding: 6px 12px; }
      .small { max-width: 320px; }
      .small retro-tv {
        --retro-tv-padding: 12px; --retro-tv-gap: 10px; --retro-tv-radius: 16px;
        --retro-tv-bezel-padding: 10px; --retro-tv-bezel-radius: 12px; --retro-tv-side-width: 40px;
        --retro-tv-knob-size: 30px; --retro-tv-knob-mark-top: 4px; --retro-tv-knob-mark-width: 3px;
        --retro-tv-knob-mark-height: 9px; --retro-tv-knob-mark-origin: 11px; --retro-tv-grille-width: 30px;
        --retro-tv-grille-min-height: 50px; --retro-tv-led-size: 8px; --retro-tv-osd-size: 22px;
        --retro-tv-screen-radius: 22px / 28px; --retro-tv-side-padding: 6px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>retro-tv</h1>
      <p>Channels with working knobs. The channel knob and the CH buttons move through the programs; Power turns the set off and on (remembered in this browser).</p>
      <retro-tv id="tv" channel="4" controls osd-fade remember-power="retro-tv-demo">
        <retro-tv-title-sequence channel="3" crawl-title="Rewind the web" presenter="HAX" kicker="Feature" runtime="7"></retro-tv-title-sequence>
        <retro-tv-hax-tv channel="4"></retro-tv-hax-tv>
        <retro-tv-credits id="credits" channel="5" tape="001"></retro-tv-credits>
        <retro-tv-home-computer channel="7"></retro-tv-home-computer>
        <retro-tv-handheld channel="8"></retro-tv-handheld>
        <retro-tv-pc channel="9" command="INSTALL /CHECK"></retro-tv-pc>
        <retro-tv-disc channel="10"></retro-tv-disc>
      </retro-tv>
      <div class="row">
        <button id="prev">CH −</button><button id="next">CH +</button><button id="power">Power</button><button id="load">Toggle loading</button>
        <span>Now playing: <b id="now"></b></span>
      </div>
      <h2>Compact, as in the HAXcms installer</h2>
      <div class="small">
        <retro-tv channel="4" controls>
          <retro-tv-hax-tv channel="4"></retro-tv-hax-tv>
          <retro-tv-handheld channel="8"></retro-tv-handheld>
        </retro-tv>
      </div>
    </div>
  </body>
</html>
