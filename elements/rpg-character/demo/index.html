<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">
    <title>RpgCharacter: rpg-character Demo</title>
    <script src="../../../node_modules/@haxtheweb/deduping-fix/deduping-fix.js" defer></script>
    <script type="module">
      import "@haxtheweb/demo-snippet/demo-snippet.js";
      import '../rpg-character.js';
    </script>
  </head>
  <body>
    <div class="vertical-section-container centered">
      <h3>Basic rpg-character demo</h3>
      <label for="hat">Hats</label>
      <select id="hat">
        <option value="none">None</option>
        <option value="bunny">Bunny</option>
        <option value="cowboy">Cowboy</option>
        <option value="education">Education</option>
        <option value="construction">Construction</option>
        <option value="warning">Warning</option>
        <option value="watermelon">Watermelon</option>
        <option value="coffee">Coffee</option>
        <option value="knight">Knight</option>
        <option value="ninja">Ninja</option>
        <option value="party">Party</option>
        <option value="pirate">Pirate</option>
        <option value="error">Error</option>
        <option value="edit">Edit</option>
        <option value="apple">Apple</option>
        <option value="banana">Banana</option>
        <option value="orange">Orange</option>
        <option value="pineapple">Pineapple</option>
        <option value="strawberry">Strawberry</option>
        <option value="hockey">Hockey helmet</option>
        <option value="football">Football helmet</option>
        <option value="firefighter">Firefighter helmet</option>
        <option value="police">Police cap</option>
        <option value="military">Military cap</option>
        <option value="nurse">Nurse cap</option>
        <option value="soda">Soda shop cap</option>
        <option value="doctor">Head mirror</option>
        <option value="helmet">Oversized helmet</option>
      </select>
      <label for="preset">Character type</label>
      <select id="preset" data-prop="preset"></select>
      <label for="mask">Mask</label>
      <select id="mask" data-prop="mask"></select>
      <label for="makeup">Makeup</label>
      <select id="makeup" data-prop="makeup"></select>
      <label for="item">Held item</label>
      <select id="item" data-prop="item"></select>
      <label for="flagText">Flag text</label>
      <input id="flagText" size="4" maxlength="4"/>
      <label for="offhand">Off-hand</label>
      <select id="offhand" data-prop="offhand"></select>
      <label for="feet">Feet</label>
      <select id="feet" data-prop="feet"></select>
      <label for="pet">Pet</label>
      <select id="pet" data-prop="pet"></select>
      <label for="shaved">Shaved?</label>
      <input id="shaved" type="checkbox" />
      <label for="seed">Seed</label>
      <input id="seed" size="20"/>
      <label for="height">height</label>
      <input id="height" size="20" type="number"/>
      <label for="width">width</label>
      <input id="width" size="20" type="number"/>
      <label for="circle">Circle?</label>
      <input id="circle" type="checkbox" />
      <label for="fire">Fire!?!?</label>
      <input id="fire" type="checkbox" />
      <label>Accent color</label>
      <simple-colors-picker id="accent" value="orange"></simple-colors-picker>
      <label for="walking">Walking?</label>
      <input id="walking" type="checkbox" />
      <button id="dice">Roll the dice</button>
      <h2>Example RPG characters</h2>
      <demo-snippet>
        <template>
          <div>
            <rpg-character literalseed seed="1513432127"></rpg-character>
            <rpg-character seed="121212100000000"></rpg-character>
            <rpg-character seed="btopro"></rpg-character>
          </div>
        </template>
      </demo-snippet>
      <h2>Character types</h2>
      <p>A preset dresses whoever the seed makes; explicit hat / item / offhand / feet values win over the preset's defaults.</p>
      <demo-snippet>
        <template>
          <div>
            <rpg-character seed="skater" preset="hockey"></rpg-character>
            <rpg-character seed="gameday" preset="football"></rpg-character>
            <rpg-character seed="engine9" preset="firefighter"></rpg-character>
            <rpg-character seed="officer" preset="police"></rpg-character>
            <rpg-character seed="service" preset="veteran"></rpg-character>
            <rpg-character seed="rn" preset="nurse"></rpg-character>
            <rpg-character seed="helpdesk" preset="it"></rpg-character>
            <rpg-character seed="md" preset="doctor"></rpg-character>
            <rpg-character seed="malt" preset="soda"></rpg-character>
            <rpg-character seed="sirbtopro" preset="knight"></rpg-character>
            <rpg-character seed="arr" preset="pirate"></rpg-character>
            <rpg-character seed="classof" preset="graduate"></rpg-character>
          </div>
        </template>
      </demo-snippet>
      <h2>Masks, makeup and gear</h2>
      <demo-snippet>
        <template>
          <div>
            <rpg-character seed="roar" mask="lion" item="flag" flag-text="GO"></rpg-character>
            <rpg-character seed="beak" mask="plague"></rpg-character>
            <rpg-character seed="grin" mask="theater"></rpg-character>
            <rpg-character seed="honk" makeup="clown"></rpg-character>
            <rpg-character seed="rouge" makeup="red-lipstick"></rpg-character>
            <rpg-character seed="dome" hat="helmet"></rpg-character>
            <rpg-character seed="fruity" hat="pineapple" item="milkshake"></rpg-character>
            <rpg-character seed="champ" shaved item="trophy" pet="cat"></rpg-character>
            <rpg-character seed="kickflip" feet="skateboard" item="phone"></rpg-character>
          </div>
        </template>
      </demo-snippet>
      <script async defer>
        function dqs(sel) { return document.querySelector(sel); }
        function dqsa(sel) { return document.querySelectorAll(sel); }
        dqs("#accent").addEventListener("changed", (e) => {
          dqs("rpg-character").accentColor = e.detail.value;
        });
        dqs("#hat").addEventListener("input", (e) => {
          dqs("rpg-character").hat = e.target.value;
        });
        dqs("#seed").addEventListener("input", (e) => {
          dqs("rpg-character").seed = e.target.value;
        });
        dqs("#height").addEventListener("input", (e) => {
          dqs("rpg-character").height = e.target.value;
        });
        dqs("#width").addEventListener("input", (e) => {
          dqs("rpg-character").width = e.target.value;
        });
        dqs("#walking").addEventListener("change", (e) => {
          dqs("rpg-character").walking = e.target.checked;
        });
        dqs("#circle").addEventListener("change", (e) => {
          dqs("rpg-character").circle = e.target.checked;
        });
        dqs("#fire").addEventListener("change", (e) => {
          dqs("rpg-character").fire = e.target.checked;
        });
        dqs("#dice").addEventListener("click", (e) => {
          Array.from(dqsa("rpg-character")).forEach((item) => {
            item.seed = Math.random().toString(36).substring(2,12);
          });
        });
        Array.from(dqsa("rpg-character")).forEach((item) => {
          item.demo = true;
        });
      </script>
      <script type="module" defer>
        import '@haxtheweb/simple-colors/lib/simple-colors-picker.js';
        import {
          presets,
          maskList,
          makeupList,
          itemList,
          offhandList,
          feetList,
          petList,
        } from '../rpg-character.js';
        const lists = {
          preset: Object.keys(presets),
          mask: maskList,
          makeup: makeupList,
          item: itemList,
          offhand: offhandList,
          feet: feetList,
          pet: petList,
        };
        const first = () => document.querySelector("rpg-character");
        Object.keys(lists).forEach((prop) => {
          const select = document.querySelector(`select[data-prop="${prop}"]`);
          ["none", ...lists[prop]].forEach((value) => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            select.appendChild(option);
          });
          select.addEventListener("input", (e) => {
            first()[prop] = e.target.value;
          });
        });
        document.querySelector("#flagText").addEventListener("input", (e) => {
          first().flagText = e.target.value;
        });
        document.querySelector("#shaved").addEventListener("change", (e) => {
          first().shaved = e.target.checked;
        });
      </script>
    </div>
  </body>
</html>
