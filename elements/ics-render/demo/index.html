<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">
    <title>IcsRender: ics-render Demo</title>
    <script src="../../../node_modules/@haxtheweb/deduping-fix/deduping-fix.js"></script>
    <script type="module">
      import '../ics-render.js';
    </script>
    <style>
      body {
        font-family: sans-serif;
        margin: 0 auto;
        max-width: 1100px;
        padding: 16px;
      }
      h3 {
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <div class="vertical-section-container centered">
      <h1>ics-render</h1>
      <p>The same calendar in every display mode. It holds a timed event, an event in a named timezone, and an all day recurring event, so the modes can be compared on content that is not all alike.</p>
      <h3>Date cards</h3>
      <ics-render display-as="cards"></ics-render>

      <h3>Timeline</h3>
      <ics-render display-as="timeline"></ics-render>

      <h3>Table</h3>
      <ics-render display-as="table"></ics-render>

      <h3>List</h3>
      <ics-render display-as="list"></ics-render>

      <h3>From a file, through data-source</h3>
      <ics-render data-source="./sample.ics" debounce-delay="0"></ics-render>
    </div>
    <script type="module">
      // the modes above read the file contents inline so the demo works with
      // no server and no network; the last one fetches sample.ics instead
      const response = await fetch('./sample.ics');
      const text = await response.text();
      globalThis.document
        .querySelectorAll('ics-render:not([data-source])')
        .forEach((element) => {
          element.calendarData = text;
        });
    </script>
  </body>
</html>
