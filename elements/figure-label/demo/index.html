<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">
    <title>FigureLabel: figure-label Demo</title>
    
    <script src="../../../node_modules/@haxtheweb/deduping-fix/deduping-fix.js"></script>

    <script type="module">
      
      import "@haxtheweb/demo-snippet/demo-snippet.js";
      import '../figure-label.js';
    </script>
    
  </head>
  <body>
    <div class="vertical-section-container centered">
      <h3>Basic figure-label demo</h3>
      <demo-snippet>
        <template>
          <figure-label title="1.3" description="Microbs under microscope"></figure-label>
        </template>
      </demo-snippet>
      <demo-snippet>
        <template>
          <div>
            <figure-label title="1.3" description="Default color styling">
            </figure-label>
            <div style="--ddd-theme-accent: var(--ddd-theme-default-pughBlue);">
              <figure-label title="1.3" description="Application override color set">
              </figure-label> <!-- application override -->
              <div style="
              --ddd-component-figure-label-title: var(--ddd-theme-default-skyBlue);
              --ddd-component-figure-label-title-text: var(--ddd-theme-default-white);
              --ddd-component-figure-label-description-text: var(--ddd-theme-default-limestoneMaxLight);
              background-color: var(--ddd-theme-default-nittanyNavy);
              padding: var(--ddd-spacing-4);
              ">
                <figure-label title="1.3" description="Component override color set">
                </figure-label> <!-- component override -->
              </div>
            </div>
          </div>

        </template>
      </demo-snippet>
    </div>
  </body>
</html>
