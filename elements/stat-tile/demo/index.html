<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">
    <title>stat-tile demo</title>
    <script src="../../../node_modules/@haxtheweb/deduping-fix/deduping-fix.js"></script>
    <script type="module">
      import '@haxtheweb/d-d-d/d-d-d.js';
      import '../stat-tile.js';
    </script>
    <style>
      .row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: var(--ddd-spacing-4);
        max-width: 720px;
      }
    </style>
  </head>
  <body>
    <h1>stat-tile</h1>
    <h2>A dashboard row</h2>
    <div class="row">
      <stat-tile label="Enrolled" value="1284" change="6% this term" trend="up"></stat-tile>
      <stat-tile label="Completion" value="87%" change="3 points" trend="up"></stat-tile>
      <stat-tile label="Open issues" value="14" change="5 since Monday" trend="down"></stat-tile>
    </div>
    <h2>Without a change line</h2>
    <div class="row">
      <stat-tile label="Lessons" value="42"></stat-tile>
    </div>
  </body>
</html>
