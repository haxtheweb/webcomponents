<p>This site is a HAXcms site. Its pages are HTML files, its outline is one JSON file, and its theme is a web component.</p>
<h2>How it is made</h2>
<a11y-collapse heading="Can I change the theme later?"><p slot="content">Yes. The pages do not change when the theme does.</p></a11y-collapse>
<a11y-collapse heading="Can I edit in the browser?"><p slot="content">Yes. Log in and the editor works here as it does in any HAXcms theme.</p></a11y-collapse>
