<p>Twice a year we measure the height of the marsh surface at fourteen sites and compare it with the tide record.</p><h2 data-style-guide="headline" data-design-treatment="vert" data-primary="8" data-padding="xs" data-border-radius="xs">What we have found</h2><p>Most sites are keeping up. The ones that are not have lost their tall grass at the water edge.</p><editable-table accent-color="grey" column-header><table><caption>Survey at a glance</caption><thead><tr><th scope="col">Measure</th><th scope="col">Value</th></tr></thead><tbody><tr><td>Sites</td><td>14</td></tr><tr><td>Visits a year</td><td>2</td></tr><tr><td>Years of data</td><td>10</td></tr></tbody></table></editable-table>
