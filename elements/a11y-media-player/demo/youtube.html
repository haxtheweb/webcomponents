<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">

    <title>a11y-media-player demo</title>

    
    <script src="../../../node_modules/@haxtheweb/deduping-fix/deduping-fix.js"></script>


    <script type="module">
      
      import "@haxtheweb/demo-snippet/demo-snippet.js";
      import "../a11y-media-player.js";
    </script>
    <style>
      .vertical-section-container.centered>* {
        --demo-snippet-demo: {
          padding: 0;
        };
      }
    
      .vertical-section-container.centered {
        width: 100%;
        max-width: unset !important;
      }
    
      .smaller-examples {
        max-width: 75%;
        min-width: 400px;
        margin: 0 auto;
      }
    
      @media print {
        demo-snippet {
          height: undet;
          overflow: visible;
        }
      }
    </style>
  </head>
  <body>
    <div class="vertical-section-container centered">
      <h1>a11y-media-player YouTube</h1>
      
      <div class="smaller-examples"> 
        <h2>a11y-media-player YouTube demo</h2>
        <demo-snippet>
          <template>
            <a11y-media-player accent-color="red" youtube-id="BKorP55Aqvg"></a11y-media-player>
          </template>
        </demo-snippet> 
      </div>




      <h2>a11y-media-player with YouTube's iframe for progressive enhancement</h2>
      <demo-snippet>
        <template>
          <a11y-media-player accent-color="red">
            <iframe title="youtube video" width="560" height="315" src="https://www.youtube.com/embed/BKorP55Aqvg" allowfullscreen></iframe>
          </a11y-media-player>
        </template>
      </demo-snippet> 


      
      <div class="smaller-examples"> 

        <h2>a11y-media-player YouTube demo, standalone with width set</h2>
        <demo-snippet>
          <template>
            <a11y-media-player 
              accent-color="deep-orange" 
              stand-alone width="400px" 
              youtube-id="BKorP55Aqvg">
            </a11y-media-player>
          </template>
        </demo-snippet>      
      </div>
    </div>
  </body>
</html>
