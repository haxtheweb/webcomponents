name: Set up Playwright Chromium
description: >-
  Installs the Chromium build that the yarn.lock-resolved Playwright launches.
  The browser download is cached per Playwright version. Jobs that do not
  measure text rendering skip the Ubuntu package mirrors entirely, so a mirror
  outage only touches the jobs that need extra fonts, and those retry and then
  fail fast with a clear message instead of hanging on apt.
inputs:
  fonts:
    description: >-
      "true" for checks whose results depend on how text renders (contrast,
      pseudo-locale/RTL layout, dark mode): installs the CJK, Thai, Cyrillic
      and emoji fonts that `playwright install --with-deps` adds through apt.
      "false" installs no apt packages unless Chromium cannot launch without
      them.
    required: false
    default: "false"
  log-file:
    description: Optional path the install output is appended to.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Resolve the Playwright version and Ubuntu release
      id: version
      shell: bash
      run: |
        echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "os-release=$(. /etc/os-release && echo "${ID}-${VERSION_ID}")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.version.outputs.version }}-chromium
    - name: Install Chromium
      # also runs on a cache hit: a no-op when the build is present, and it
      # repairs a cache that is missing part of the browser
      shell: bash
      env:
        LOG_FILE: ${{ inputs.log-file }}
      run: bash "$GITHUB_ACTION_PATH/install.sh" browser
    - name: Cache font packages
      # the .deb files from the first successful apt install, per runner
      # image and Playwright version, so later runs install them without
      # reaching the Ubuntu mirrors
      if: inputs.fonts == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-font-debs
        key: ${{ steps.version.outputs.os-release }}-${{ runner.arch }}-playwright-font-debs-${{ steps.version.outputs.version }}
    - name: Install system packages
      shell: bash
      env:
        FONTS: ${{ inputs.fonts }}
        LOG_FILE: ${{ inputs.log-file }}
      run: bash "$GITHUB_ACTION_PATH/install.sh" deps
