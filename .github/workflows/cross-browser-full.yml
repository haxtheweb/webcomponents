name: cross-browser full suite
# Runs the entire test bed (the same files `yarn test:all` runs in Chromium) in
# Firefox and WebKit, nightly and on demand. Chromium-only CI let a Safari-class
# SVG attribute bug through (simple-icon xlink:href), and BROWSER-SUPPORT-MATRIX.md
# lists Firefox and Safari as supported engines.
#
# Advisory (continue-on-error): this is the baseline run. Failures show up in the
# job summary and in an uploaded log, so they can be fixed or quarantined. When it
# is green, promote it: run it on pull_request and drop continue-on-error. The
# lighter per-PR smoke job lives in cross-browser.yml.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    name: "${{ matrix.browser }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright@1.63.0 install --with-deps ${{ matrix.browser }}
      - name: Test all elements
        run: >
          npx web-test-runner
          "elements/*/test/*.test.js"
          --node-resolve --root-dir . --playwright --browsers ${{ matrix.browser }} --static-logging
          2>&1 | tee wtr-${{ matrix.browser }}.log; test "${PIPESTATUS[0]}" -eq 0
      - name: Summarize failures
        if: always()
        run: |
          {
            echo "### ${{ matrix.browser }}"
            echo '```'
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' wtr-${{ matrix.browser }}.log | grep -E '❌|✗|passed|failed|Error|did not finish' | tail -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wtr-${{ matrix.browser }}-log
          path: wtr-${{ matrix.browser }}.log
