name: size-report

# Report-only element size delta (scripts/size-report.mjs).
#
# For every element entry (package main files and wc-registry.json tags) it
# measures what a page downloads: the gzip size of each file in the eager
# import closure, since HAX serves unbundled modules and we don't tree
# shake. The PR head and its base are measured and only the entries that
# changed go to the job summary.
#
# REPORT ONLY: never fails the job and posts no PR comments. Budgets are
# deferred until the platform is stable (haxtheweb/issues#3283); this is
# the measurement they will build on.
on:
  # No branch filter: stacked PRs (base is another feature branch) must run too.
  pull_request:
    paths:
      - "elements/**/*.js"
      - "elements/*/package.json"
      - wc-registry.json
      - scripts/size-report.mjs
      - .github/workflows/size-report.yml
permissions:
  contents: read
concurrency:
  group: size-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  size:
    name: Element size (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only what the report reads: element JavaScript, manifests and the
      # registry (skips demos, locales and images).
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /elements/**/*.js
            /elements/*/package.json
            /wc-registry.json
            /scripts/size-report.mjs

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /elements/**/*.js
            /elements/*/package.json
            /wc-registry.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # the PR's copy of the script measures both trees, so a change to the
      # script itself is compared like for like
      - name: Measure and compare
        continue-on-error: true
        run: |
          set -euo pipefail
          node head/scripts/size-report.mjs --root head --json size-head.json
          node head/scripts/size-report.mjs --root base --json size-base.json
          node head/scripts/size-report.mjs --compare size-base.json size-head.json --summary-file size-summary.md
          cat size-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-report
          path: |
            size-head.json
            size-base.json
            size-summary.md
          if-no-files-found: ignore
          retention-days: 30
