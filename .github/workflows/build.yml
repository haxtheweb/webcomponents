name: build
on:
  push:
    branches: [master]
  # No branch filter: stacked PRs (base is another feature branch) must run too.
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    name: "${{ matrix.platform }}: node.js ${{ matrix.node-version }}"
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        node-version: [24]
        include:
          - platform: ubuntu-latest
            node-version: 24
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Stylelint check
        run: npx stylelint **/*.css
      - name: Install Playwright Chromium
        # Use the Playwright resolved by yarn.lock (pulled in by
        # @web/test-runner-playwright) so the downloaded browser build always
        # matches what the test runner launches. A hard-coded version here
        # drifts every time the lockfile bumps Playwright and fails with
        # "Executable doesn't exist ... chromium_headless_shell-NNNN".
        run: yarn playwright install --with-deps chromium
      - name: Test all elements
        # Quiet reporter: progress ticks, then every failure grouped at the
        # end of this step's log instead of buried among ~13k passing tests.
        # The same failures land in test-failures.json (artifact below) so
        # runs can be compared to tell a flake from a real failure.
        env:
          WTR_REPORTER: failures
          WTR_FAILURES_JSON: test-failures.json
        run: yarn test:all
      - name: Upload test failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failures-node-${{ matrix.node-version }}
          path: test-failures.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Prettier format check
        # Advisory only, like ESLint: formatting drift should never stop the
        # tests from running. The unquoted glob only reaches one directory
        # deep (effectively scripts/), so it was failing builds over build
        # scripts while checking none of elements/. Formatting is enforced
        # where it matters: lint-staged on commit and `yarn precheck` on PRs.
        continue-on-error: true
        run: npx prettier --check **/*.{js,json}
      - name: ESLint
        # Advisory only: lint runs after the real tests and never fails the
        # build (findings still show as annotations / in the log).
        continue-on-error: true
        run: yarn lint
      - name: Validate component gallery build
        run: yarn build-gallery
      - name: Rebuild Elements README
        run: cd elements && for dir in */; do head -4 $dir/README.md; done > README.md
