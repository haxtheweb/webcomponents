name: build
on:
  push:
    branches: [master]
  # No branch filter: stacked PRs (base is another feature branch) must run too.
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    name: "${{ matrix.platform }}: node.js ${{ matrix.node-version }}"
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        node-version: [24]
        include:
          - platform: ubuntu-latest
            node-version: 24
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-
      - name: Install
        run: yarn install
      - name: Prettier format check
        run: npx prettier --check **/*.{js,json}
      - name: Stylelint check
        run: npx stylelint **/*.css
      - name: ESLint (non-blocking)
        # Non-blocking rollout: 2000+ pre-existing files have no prior ESLint
        # history, so a blocking failure here would fail every PR on
        # unrelated pre-existing issues. The default "stylish" formatter
        # prints a total error/warning count summary at the end, so counts
        # are still visible in the CI log for tracking.
        continue-on-error: true
        run: yarn lint
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test all elements
        run: yarn test:all
      - name: Validate component gallery build
        run: yarn build-gallery
      - name: Rebuild Elements README
        run: cd elements && for dir in */; do head -4 $dir/README.md; done > README.md
