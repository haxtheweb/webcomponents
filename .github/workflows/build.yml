name: build
on:
  push:
    branches: [master]
  # No branch filter: stacked PRs (base is another feature branch) must run too.
  pull_request:
  # Nightly regression run on the default branch (haxtheweb/issues#3262).
  # A failure shows up as a failed scheduled run; nothing is opened.
  schedule:
    - cron: "43 8 * * *" # nightly, 08:43 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Fast lint feedback: the same `yarn lint` as the ESLint step in
  # build-and-test, on its own so a lint error shows up in about a minute
  # instead of after the full test run. build-and-test keeps its ESLint step
  # because that job is the required check that gates merging.
  lint:
    name: "ESLint (fast)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-node-24-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-24-yarn-
      - name: Install
        run: yarn install --frozen-lockfile
      - name: ESLint
        run: yarn lint
  build-and-test:
    name: "${{ matrix.platform }}: node.js ${{ matrix.node-version }}"
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        node-version: [24]
        include:
          - platform: ubuntu-latest
            node-version: 24
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-
      - name: Install
        run: yarn install --frozen-lockfile
      # node --test suites for the repo scripts (xAPI conformance and
      # vocabulary, docs extractor, template checks); fast, and never run
      # in CI before, which let a broken conformance test go unnoticed
      - name: Script tests
        run: yarn test:scripts
      - name: Stylelint check
        run: npx stylelint **/*.css
      - name: Install Playwright Chromium
        # the Playwright version yarn.lock resolves (pulled in by
        # @web/test-runner-playwright), so the browser build matches what the
        # tests launch; cached per version. A hard-coded version drifts every
        # time the lockfile bumps Playwright and fails with "Executable
        # doesn't exist ... chromium_headless_shell-NNNN".
        # no extra fonts: Chromium runs on the runner image's libraries, so
        # this job does not depend on the Ubuntu package mirrors
        uses: $/.github/actions/setup-playwright
        timeout-minutes: 12
        with:
          fonts: "false"
      - name: Test all elements
        # Quiet reporter: progress ticks, then every failure grouped at the
        # end of this step's log instead of buried among ~13k passing tests.
        # The same failures land in test-failures.json (artifact below) so
        # runs can be compared to tell a flake from a real failure.
        env:
          WTR_REPORTER: failures
          WTR_FAILURES_JSON: test-failures.json
        run: yarn test:all
      - name: Upload test failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failures-node-${{ matrix.node-version }}
          path: test-failures.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Prettier format check
        # Advisory only: formatting drift should never stop the tests from
        # running. The unquoted glob only reaches one directory
        # deep (effectively scripts/), so it was failing builds over build
        # scripts while checking none of elements/. Formatting is enforced
        # where it matters: lint-staged on commit and `yarn precheck` on PRs.
        continue-on-error: true
        run: npx prettier --check **/*.{js,json}
      - name: ESLint
        # Blocking: an ESLint error fails the build, so lint failures feed the
        # same fix loop as test failures (haxtheweb/issues#3262). It runs after
        # the tests so a lint error never hides test results. Warnings stay
        # warnings and do not fail. Pre-existing `==` comparisons are recorded
        # in eslint-suppressions.json and do not count as errors.
        run: yarn lint
      - name: Validate component gallery build
        run: yarn build-gallery
      - name: Rebuild Elements README
        run: cd elements && for dir in */; do head -4 $dir/README.md; done > README.md
