name: rule-checks
# Blocking: HAX rules that had no check (praw RULES.md and this repo's
# AGENTS.md), each a plain script with no AI:
# - Color vision action pairs: accept / dismiss pairs in
#   scripts/vision-pairs.json stay tellable apart in greyscale and with color
#   vision deficiencies (RULES.md "Color Vision"; haxtheweb/issues#3219).
#   It already ran in yarn precheck; this runs it on every pull request.
# - No TypeScript: no .ts, .tsx, .mts or .cts source under elements/
#   (.d.ts declarations are fine).
# - Node.js latest LTS: package.json engines.node, any .nvmrc and every
#   node-version in .github/workflows name the LTS in
#   scripts/rule-checks.mjs (NODE_LTS).
# - Tests poll, don't sleep: no test file gains a fixed sleep (aTimeout,
#   setTimeout in a bare Promise, waitForTimeout). Sleeps that predate the
#   rule are in scripts/test-sleeps.baseline.json, which only shrinks: after
#   removing sleeps run `node scripts/rule-checks.mjs test-sleeps
#   --update-baseline` and commit it.
# - Shadow-boundary ARIA references: no element file gains an id reference
#   (aria-labelledby, aria-describedby, aria-controls, aria-owns,
#   aria-activedescendant, for) whose id is not written in the same file,
#   so it points across a shadow boundary or at nothing (RULES.md 410c4334).
#   A heuristic: ids handed to a shared template helper count, dynamic ids
#   are skipped, light-DOM elements are skipped.
# - a11y-collapse heading-button: no element, demo or HAX schema gains an
#   <a11y-collapse> without heading-button (RULES.md WQoGOB82).
# - Package names: every elements/<name>/package.json is @haxtheweb/<name>.
# - Theme development: every theme in haxcms-elements/lib/themes.json reaches
#   HAXCMSLitElementTheme (or HAXCMSLitElement) through its extends chain.
# - Element docs setup: an element ships lib/<tag>.docs.json and its build
#   regenerates it (praw RULES.md f3c77167).
# - ES modules: no shipped element code gains CommonJS (module.exports,
#   exports.x, require); the vendored bundles that predate it are baselined.
# - Secrets: no tracked file holds a high-confidence secret shape (cloud
#   keys, tokens, private keys); a value that has to ship is listed in
#   scripts/secrets-allow.json by hash, with why (AGENTS.md Sensitive Data).
# - MFR namespacing: no new calls in the retired @haxcms/ micro-frontend
#   namespace; new work uses @system/ or @site/ (praw RULES.md 82dc87fd).
# - Incorrect is purple: no wrong-answer style painted red (RULES.md 8d0c033b).
# - Tracking is declared: a file that sends xAPI declares static get
#   xapiVocabulary(), which the What's tracked view and My learning read
#   (RULES.md ea643795).
# - Authored links kept: no http link rewrite or upgrade-insecure-requests
#   (RULES.md f54de8cb).
# - Model calls: no element calls a model unless scripts/ai-call-sites.json
#   lists it with the test covering each AI Content rule, and no test reaches
#   a real model (praw RULES.md, AI Content). None today.
# The ARIA, a11y-collapse, docs, ES module, MFR, incorrect, tracking and
# link checks are counted per file
# against scripts/<check>.baseline.json, which
# only shrinks, like the test sleeps.
# All of it runs in yarn precheck too (yarn lint:rules, yarn lint:vision).
on:
  push:
    branches: [master]
  # No branch filter: stacked PRs (base is another feature branch) must run too.
  pull_request:
permissions:
  contents: read
jobs:
  rule-checks:
    name: Rule checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Color vision action pairs
        run: node scripts/vision-pairs-check.mjs --strict --quiet
      - name: No TypeScript
        if: always()
        run: node scripts/rule-checks.mjs typescript
      - name: Node.js latest LTS
        if: always()
        run: node scripts/rule-checks.mjs node-version
      - name: Tests poll, don't sleep
        if: always()
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/rule-checks.mjs test-sleeps --base "$BASE_REF"
          else
            node scripts/rule-checks.mjs test-sleeps
          fi
      - name: Shadow-boundary ARIA references
        if: always()
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/rule-checks.mjs aria-refs --base "$BASE_REF"
          else
            node scripts/rule-checks.mjs aria-refs
          fi
      - name: a11y-collapse heading-button
        if: always()
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/rule-checks.mjs a11y-collapse --base "$BASE_REF"
          else
            node scripts/rule-checks.mjs a11y-collapse
          fi
      - name: Package names
        if: always()
        run: node scripts/rule-checks.mjs package-names
      - name: Themes extend HAXCMSLitElementTheme
        if: always()
        run: node scripts/rule-checks.mjs themes
      - name: Element docs setup
        if: always()
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/rule-checks.mjs element-docs --base "$BASE_REF"
          else
            node scripts/rule-checks.mjs element-docs
          fi
      - name: ES modules
        if: always()
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/rule-checks.mjs es-modules --base "$BASE_REF"
          else
            node scripts/rule-checks.mjs es-modules
          fi
      - name: Secrets
        if: always()
        run: node scripts/rule-checks.mjs secrets
      - name: MFR namespacing
        if: always()
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/rule-checks.mjs mfr-haxcms --base "$BASE_REF"
          else
            node scripts/rule-checks.mjs mfr-haxcms
          fi
      - name: Incorrect is purple, never red
        if: always()
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/rule-checks.mjs incorrect-colors --base "$BASE_REF"
          else
            node scripts/rule-checks.mjs incorrect-colors
          fi
      - name: Tracking is declared
        if: always()
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/rule-checks.mjs tracking-declared --base "$BASE_REF"
          else
            node scripts/rule-checks.mjs tracking-declared
          fi
      - name: Authored links kept
        if: always()
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/rule-checks.mjs link-rewrites --base "$BASE_REF"
          else
            node scripts/rule-checks.mjs link-rewrites
          fi
      - name: Model calls
        if: always()
        run: node scripts/rule-checks.mjs model-calls
